<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" role="img" aria-label="Illustration of a sweet lassi glass">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2c52"/><stop offset="1" stop-color="#0a1122"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fdf3d7" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#f7e7c3"/>
      <stop offset="1" stop-color="#e9c05e"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#f3d689"/>
    </linearGradient>
  </defs>
  <rect width="200" height="260" rx="22" fill="url(#bg)"/>
  <ellipse cx="100" cy="232" rx="58" ry="9" fill="#000" opacity="0.45"/>
  <!-- glass body -->
  <path d="M72 70 L88 208 Q100 218 112 208 L128 70 Z" fill="url(#glass)"/>
  <path d="M72 70 L128 70 L128 80 L72 80 Z" fill="#fff" opacity="0.35"/>
  <path d="M72 70 L88 208 Q100 218 112 208 L128 70" fill="none" stroke="#b9872a" stroke-width="2" opacity="0.6"/>
  <!-- lassi -->
  <path d="M75 96 L95 202 Q100 208 105 202 L125 96 Z" fill="#fff6dc" opacity="0.92"/>
  <!-- malai cream top -->
  <ellipse cx="100" cy="94" rx="30" ry="9" fill="url(#cream)"/>
  <path d="M74 94 Q88 84 100 94 Q112 84 126 94 L126 102 Q112 92 100 102 Q88 92 74 102 Z" fill="#fffaf0"/>
  <!-- saffron strands -->
  <path d="M88 88 q4 -5 7 -1 M100 85 q4 -5 7 -1 M112 88 q4 -5 7 -1" stroke="#d9a63c" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <!-- pistachio bits -->
  <circle cx="92" cy="96" r="1.7" fill="#7aa65c"/><circle cx="101" cy="99" r="1.7" fill="#7aa65c"/><circle cx="109" cy="96" r="1.7" fill="#7aa65c"/>
  <!-- straw -->
  <rect x="113" y="44" width="5" height="56" rx="2.5" fill="#d9a63c"/>
  <!-- steam -->
  <path d="M86 64 q-4 -8 2 -14 M100 60 q-4 -8 2 -14 M114 64 q-4 -8 2 -14" stroke="#f8f2e4" stroke-width="2.4" fill="none" opacity="0.5" stroke-linecap="round"/>
  <!-- sparkles -->
  <circle cx="46" cy="70" r="2.2" fill="#e9c05e" opacity="0.8"/><circle cx="156" cy="120" r="2.2" fill="#e9c05e" opacity="0.6"/>
  <circle cx="40" cy="150" r="1.6" fill="#f8f2e4" opacity="0.5"/><circle cx="162" cy="60" r="1.6" fill="#f8f2e4" opacity="0.5"/>
  <path d="M34 96 l4 3 -4 3 M168 170 l4 3 -4 3" stroke="#e9c05e" stroke-width="1.4" fill="none" opacity="0.7" stroke-linecap="round"/>
</svg>
