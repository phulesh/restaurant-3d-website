<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" role="img" aria-label="Illustration of a blue lagoon mint mojito mocktail">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2c52"/><stop offset="1" stop-color="#0a1122"/>
    </linearGradient>
    <linearGradient id="liq" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ec8e8"/><stop offset="0.5" stop-color="#55e0f5"/>
      <stop offset="1" stop-color="#1aa3c9"/>
    </linearGradient>
  </defs>
  <rect width="200" height="260" rx="22" fill="url(#bg)"/>
  <ellipse cx="100" cy="234" rx="52" ry="8" fill="#000" opacity="0.45"/>
  <!-- glass -->
  <path d="M78 56 L66 200 Q66 210 76 210 L124 210 Q134 210 134 200 L122 56 Z" fill="#dff6fd" opacity="0.16"/>
  <path d="M78 56 L66 200 Q66 210 76 210 L124 210 Q134 210 134 200 L122 56 Z" fill="none" stroke="#8fd9ec" stroke-width="2" opacity="0.55"/>
  <!-- liquid -->
  <path d="M70 96 Q100 88 130 96 L124 200 Q124 206 116 206 L84 206 Q76 206 76 200 Z" fill="url(#liq)" opacity="0.88"/>
  <!-- ice cubes -->
  <rect x="82" y="112" width="22" height="20" rx="4" fill="#eaffff" opacity="0.5"/>
  <rect x="108" y="126" width="22" height="20" rx="4" fill="#eaffff" opacity="0.4"/>
  <rect x="90" y="140" width="20" height="18" rx="4" fill="#eaffff" opacity="0.35"/>
  <!-- bubbles -->
  <circle cx="92" cy="120" r="2.4" fill="#fff" opacity="0.8"/><circle cx="112" cy="104" r="1.8" fill="#fff" opacity="0.7"/>
  <circle cx="102" cy="136" r="1.5" fill="#fff" opacity="0.6"/><circle cx="120" cy="160" r="2" fill="#fff" opacity="0.5"/>
  <circle cx="86" cy="164" r="1.6" fill="#fff" opacity="0.5"/>
  <!-- mint leaves -->
  <g transform="rotate(-24 140 78)">
    <path d="M140 78 q10 -14 22 -12 q-2 14 -14 20 q-6 -2 -8 -8z" fill="#3fae62"/>
    <path d="M140 78 q6 -4 12 -2" stroke="#2c8a4c" stroke-width="1.2" fill="none"/>
  </g>
  <g transform="rotate(18 62 84)">
    <path d="M62 84 q10 -14 22 -12 q-2 14 -14 20 q-6 -2 -8 -8z" fill="#46bc6d"/>
    <path d="M62 84 q6 -4 12 -2" stroke="#2c8a4c" stroke-width="1.2" fill="none"/>
  </g>
  <!-- lemon wheel -->
  <circle cx="156" cy="140" r="15" fill="#f3d689"/>
  <circle cx="156" cy="140" r="10.5" fill="#ffe9a8" stroke="#d9a63c" stroke-width="1.4"/>
  <path d="M156 132 l4 7 -7 4 M156 148 l-3 -6 6 -3" stroke="#e9c05e" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <!-- straw -->
  <rect x="112" y="30" width="5" height="60" rx="2.5" fill="#d9a63c"/>
  <path d="M112 52 h5 M112 64 h5" stroke="#b9872a" stroke-width="1.4"/>
  <!-- sparkles -->
  <path d="M40 60 l3 3 -3 3 M164 60 l3 3 -3 3 M46 190 l3 3 -3 3" stroke="#e9c05e" stroke-width="1.4" fill="none" opacity="0.7" stroke-linecap="round"/>
  <circle cx="36" cy="120" r="2" fill="#e9c05e" opacity="0.7"/><circle cx="168" cy="100" r="2" fill="#e9c05e" opacity="0.6"/>
</svg>
